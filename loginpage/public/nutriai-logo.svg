<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background rounded gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1c30" />
      <stop offset="100%" stop-color="#063251" />
    </linearGradient>

    <!-- Emerald-to-Teal Organic Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00855b" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- AI Cyan-to-Cerulean Neural Gradient -->
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0091d5" />
      <stop offset="100%" stop-color="#006194" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#bgGrad)" />
  <rect x="4.5" y="4.5" width="111" height="111" rx="27.5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Ambient Light Pulse -->
  <circle cx="60" cy="60" r="38" fill="url(#centerGlow)" />

  <!-- Organic Nutrition Leaf (Left Wing) -->
  <path
    d="M 60 22 C 40 22 26 38 26 58 C 26 78 42 94 60 98 C 55 86 52 74 53 60 C 54 44 60 32 60 22 Z"
    fill="url(#leafGrad)"
    opacity="0.95"
  />

  <!-- Neural AI Geometric Wing & Pulse (Right Wing) -->
  <path
    d="M 60 22 C 76 25 94 42 94 62 C 94 76 86 89 74 95 C 78 82 76 68 70 56 C 66 46 62 34 60 22 Z"
    fill="url(#aiGrad)"
    opacity="0.92"
  />

  <!-- Central Stem & Synaptic Circuit Spine -->
  <path
    d="M 60 22 L 60 98"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-linecap="round"
    opacity="0.85"
  />

  <!-- Neural Synapse Connections (AI Network Nodes) -->
  <!-- Upper Left Branch -->
  <line x1="60" y1="42" x2="42" y2="35" stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  <circle cx="42" cy="35" r="3.5" fill="#34d399" filter="url(#glow)" />
  <circle cx="42" cy="35" r="1.8" fill="#ffffff" />

  <!-- Mid Left Branch -->
  <line x1="60" y1="60" x2="36" y2="60" stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  <circle cx="36" cy="60" r="4" fill="#10b981" filter="url(#glow)" />
  <circle cx="36" cy="60" r="2" fill="#ffffff" />

  <!-- Lower Left Branch -->
  <line x1="60" y1="78" x2="44" y2="85" stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  <circle cx="44" cy="85" r="3.5" fill="#34d399" filter="url(#glow)" />
  <circle cx="44" cy="85" r="1.8" fill="#ffffff" />

  <!-- Upper Right Branch (AI Pulse) -->
  <line x1="60" y1="42" x2="78" y2="35" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  <circle cx="78" cy="35" r="3.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="78" cy="35" r="1.8" fill="#ffffff" />

  <!-- Mid Right Branch -->
  <line x1="60" y1="60" x2="84" y2="60" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  <circle cx="84" cy="60" r="4" fill="#0091d5" filter="url(#glow)" />
  <circle cx="84" cy="60" r="2" fill="#ffffff" />

  <!-- Lower Right Branch -->
  <line x1="60" y1="78" x2="76" y2="85" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  <circle cx="76" cy="85" r="3.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="76" cy="85" r="1.8" fill="#ffffff" />

  <!-- Central Intelligence Core Spark (Intersection node) -->
  <circle cx="60" cy="54" r="6" fill="#ffffff" filter="url(#glow)" />
  <circle cx="60" cy="54" r="3.5" fill="#00e5a3" />

  <!-- Top Sprout Apex Indicator -->
  <circle cx="60" cy="22" r="3" fill="#ffffff" />
</svg>
