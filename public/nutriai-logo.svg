<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="nutriGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#047857" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Rounded Shield / Tile -->
  <rect width="128" height="128" rx="28" fill="url(#nutriGrad)" filter="url(#glow)" />
  
  <!-- Subtle inner border -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2" />

  <!-- Botanical Leaf Shape -->
  <path d="M64 24 C86 24 100 42 98 68 C80 68 64 56 64 24 Z" fill="#a7f3d0" opacity="0.9" />
  
  <!-- AI Spark / Health Pulse Flow -->
  <path d="M28 72 L46 72 L54 52 L64 88 L74 64 L82 72 L100 72" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- AI Intelligence Core Sparkle -->
  <circle cx="64" cy="88" r="4.5" fill="#34d399" stroke="#ffffff" stroke-width="2" />
  <circle cx="54" cy="52" r="4" fill="#a7f3d0" />
</svg>
