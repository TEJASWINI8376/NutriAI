<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nutriBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b233a" />
      <stop offset="60%" stop-color="#07192d" />
      <stop offset="100%" stop-color="#031020" />
    </linearGradient>
    <linearGradient id="greenLobeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="45%" stop-color="#00c853" />
      <stop offset="100%" stop-color="#00963e" />
    </linearGradient>
    <linearGradient id="blueLobeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="50%" stop-color="#0084ff" />
      <stop offset="100%" stop-color="#0066cc" />
    </linearGradient>
    <radialGradient id="cyanHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#00c8ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0084ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="greenHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#69f0ae" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00e676" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00c853" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Squircle -->
  <rect x="10" y="10" width="80" height="80" rx="24" fill="url(#nutriBgGrad)" stroke="#1b395a" stroke-width="1" />

  <!-- Left Green Lobe -->
  <path d="M48.5 25.5 C32 28, 22 41, 22 55.5 C22 69, 32 80, 48.5 82.5 Z" fill="url(#greenLobeGrad)" />

  <!-- Right Blue Lobe -->
  <path d="M51.5 25.5 C68 28, 78 41, 78 55.5 C78 69, 68 80, 51.5 82.5 C51.5 73, 56.5 65, 56.5 56 C56.5 45, 51.5 35, 51.5 25.5 Z" fill="url(#blueLobeGrad)" />

  <!-- Circuits -->
  <path d="M50 42 L34 35" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
  <path d="M50 55 L29 55" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
  <path d="M50 67 L36 74" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />

  <path d="M50 43 L65 36" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
  <path d="M50 55 L70 55" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
  <path d="M50 66 L64 73" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />

  <!-- Central Spine -->
  <line x1="50" y1="23.5" x2="50" y2="83.5" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" />
  <circle cx="50" cy="23.5" r="2.6" fill="#ffffff" />

  <!-- Left Nodes -->
  <circle cx="34" cy="35" r="5" fill="url(#greenHalo)" />
  <circle cx="34" cy="35" r="2.3" fill="#ffffff" />
  <circle cx="29" cy="55" r="5" fill="url(#greenHalo)" />
  <circle cx="29" cy="55" r="2.3" fill="#ffffff" />
  <circle cx="36" cy="74" r="5" fill="url(#greenHalo)" />
  <circle cx="36" cy="74" r="2.3" fill="#ffffff" />

  <!-- Right Nodes -->
  <circle cx="65" cy="36" r="5" fill="url(#cyanHalo)" />
  <circle cx="65" cy="36" r="2.3" fill="#ffffff" />
  <circle cx="70" cy="55" r="5" fill="url(#cyanHalo)" />
  <circle cx="70" cy="55" r="2.3" fill="#ffffff" />
  <circle cx="64" cy="73" r="8" fill="url(#cyanHalo)" opacity="0.9" />
  <circle cx="64" cy="73" r="2.3" fill="#ffffff" />

  <!-- Center Node -->
  <circle cx="50" cy="55" r="5.2" fill="#07192d" stroke="#ffffff" stroke-width="2.2" />
  <circle cx="50" cy="55" r="2.2" fill="#00ff9d" />

  <!-- Verified Seal at Top-Right -->
  <g transform="translate(77, 13)">
    <circle cx="6" cy="6" r="11" fill="#ffffff" />
    <path d="M 6 -4 L 8.5 -2.5 L 11.5 -3.5 L 12.5 -0.5 L 15.5 1 L 14.5 4 L 16.5 7 L 14 9.5 L 14.5 12.5 L 11.5 13.5 L 10 16.5 L 7 15.5 L 4.5 17.5 L 2.5 15 L -0.5 15.5 L -1.5 12.5 L -4.5 11.5 L -3.5 8.5 L -5.5 6 L -3 3.5 L -3.5 0.5 L -0.5 -0.5 L 1 -3.5 L 4 -2.5 Z" fill="#006a61" />
    <circle cx="6" cy="6" r="8" fill="none" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="6" cy="6" r="7" fill="#005a52" />
    <path d="M 3 6.2 L 5.2 8.4 L 9.2 3.8" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
